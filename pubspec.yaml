name: notespot
description: "Capture anything. Find everything."
publish_to: 'none'

version: 1.0.0+9

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.4.3
  path_provider: ^2.1.5
  path: ^1.9.1
  camera: ^0.12.0+1
  image_picker: ^1.2.2
  record: ^7.0.0
  speech_to_text: ^7.4.0
  permission_handler: ^12.0.3
  tflite_flutter: ^0.12.1
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  share_plus: ^13.1.0
  shared_preferences: ^2.5.5
  audioplayers: ^6.7.1
  in_app_purchase: ^3.3.0
  printing: ^5.14.3
  archive: ^4.0.9
  flutter_colorpicker: ^1.1.0
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_image_labeling: ^0.14.2
  google_mlkit_entity_extraction: ^0.15.3
  receive_sharing_intent: ^1.8.1
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  google_mlkit_digital_ink_recognition: ^0.14.2
  home_widget: ^0.9.3
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Regular.ttf
  assets:
    - assets/icon/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_full.png"
  adaptive_icon_background: "#0F152F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  color: "#000000"
  android_12:
    color: "#000000"